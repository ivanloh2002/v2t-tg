[project]
name = "v2t-tg"
version = "0.1.0"
description = "Бот для расшифровки голосовых сообщений"
readme = "README.md"
authors = [
    { name = "Zurk", email = "ivann.loh2002@gmail.com" },
    { name = "abamka2004" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.3",
    "aiohttp-socks>=0.11.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.27.0",
    "llama-cpp-python>=0.3.34",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "python-dotenv>=1.2.2",
]

[[tool.uv.index]]
name = "llama-cpp-wheels"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu132"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-wheels" }

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001",
    "E402",
    "E501",
    "EXE001",
    "PLR1722",
    "PLW0602",
    "RUF001",
    "RUF003",
    "SIM105",
    "SIM108",
    "S110",
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportUnusedImport = true
reportUnusedVariable = true
